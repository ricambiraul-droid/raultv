services:
  - type: web
    name: raultv
    runtime: node
    plan: free
    buildCommand: npm ci || npm install
    startCommand: npm start
    healthCheckPath: /manifest.json
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CACHE_MS
        value: 600000
      - key: FETCH_TIMEOUT
        value: 12000
