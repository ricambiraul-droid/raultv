# Gazduire gratuita pe Render.com, ca addonul sa fie accesibil de oriunde.
# Vezi GAZDUIRE.txt pentru pasii completi.
services:
  - type: web
    name: raultv
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MOD
        value: simplu
      - key: PUBLIC_URL
        sync: false   # completeaza tu cu https://raultv-xxxx.onrender.com
